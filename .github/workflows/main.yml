name: Build ImmortalWrt for N1 (Amlogic GXM, OpenWrt 24.10)

on:
  # 允许手动触发编译
  workflow_dispatch:
  # 当你向 openwrt-24.10 分支提交代码时自动触发
  push:
    branches:
      - openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10
          fetch-depth: 0

      - name: Install build dependencies
        uses: ./.github/actions/setup

      - name: Update feeds and configure build
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 生成 N1 纯净固件配置（仅保留系统 + LuCI 基础）
          cat > .config <<EOF
CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv8=y
CONFIG_TARGET_armsr_armv8_DEVICE_amlogic_gxm=y

# 必须保留的基础组件
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-mod-admin-full=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_dropbear=y
CONFIG_PACKAGE_openssh-sftp-server=y
CONFIG_PACKAGE_luci-i18n-zh-cn=y
EOF

          # 标准化配置，确保依赖完整
          make defconfig

      - name: Build the firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n1-firmware
          path: bin/targets/armsr/armv8/
          retention-days: 7
