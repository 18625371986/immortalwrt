name: Build N1 Pure ImmortalWrt

on:
  # 允许你手动点击按钮触发编译
  workflow_dispatch:
  # 提交代码到指定分支时自动触发
  push:
    branches:
      - openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10

      - name: 安装依赖环境
        uses: ./.github/actions/setup

      - name: 配置N1纯净固件
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 生成配置文件（只保留基础系统+LuCI+中文）
          cat > .config <<EOF
CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv8=y
CONFIG_TARGET_armsr_armv8_DEVICE_amlogic_gxm=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-mod-admin-full=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_dropbear=y
CONFIG_PACKAGE_luci-i18n-zh-cn=y
EOF

          make defconfig

      - name: 编译固件
        run: |
          make -j$(nproc) V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-firmware
          path: bin/targets/armsr/armv8/
          retention-days: 7
