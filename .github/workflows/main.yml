name: Build N1 ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libncurses-dev gawk flex bison libssl-dev git wget curl unzip zstd pkg-config python3 python3-pip python3-setuptools

      - name: Prepare config
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<EOF
CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv8=y
CONFIG_TARGET_armsr_armv8_DEVICE_amlogic_gxm=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-mod-admin-full=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_dropbear=y
CONFIG_PACKAGE_luci-i18n-zh-cn=y
EOF
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: N1-firmware
          path: bin/targets/armsr/armv8/
